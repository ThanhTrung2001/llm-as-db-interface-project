<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClubQuery</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <strong class="brand">ClubQuery</strong>
    <span class="muted small">Hỏi đáp Text-to-SQL trên CSDL student_club (BIRD)</span>
  </header>

  <main>
    <div class="card">
      <p class="muted small">Gọi model ngay lúc hỏi. Câu hỏi tiếng Anh cho kết quả ổn định nhất (bộ BIRD bằng tiếng Anh).</p>

      <div class="grid2">
        <label>Model <select id="model"></select></label>
        <label>Câu hỏi mẫu (bộ dev BIRD, 158 câu)
          <select id="devq"><option value="">— tự nhập câu hỏi —</option></select>
        </label>
      </div>
      <label id="question-field">Câu hỏi
        <textarea id="question" rows="2" placeholder="Ví dụ: How many meetings were held in 2020?"></textarea>
      </label>
      <div id="evidence-opt" class="row small" hidden>
        <label class="check"><input type="checkbox" id="use-evidence" checked> Dùng evidence của câu mẫu</label>
      </div>
      <div id="devq-preview" class="muted small"></div>
      <button id="ask-btn" class="primary">Hỏi</button>
    </div>
    <div id="result"></div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
